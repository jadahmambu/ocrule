# 3. ADS-EXTRA (GABUNGAN: OISD FULL + AdGuard + Malikshi Antiscam)
          > ./community/data/ads-extra

          # A. OISD FULL
          curl -fsSL $OISD_FULL | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' >> ./community/data/ads-extra || true
          echo "" >> ./community/data/ads-extra

          # B. AdGuard DNS Filter
          wget -qO- $ADGUARD_DNS | sed 's/\r//g' | awk '
            !/^!/ && !/^#/ && NF {
              gsub(/^@@\|\|/, "");
              gsub(/^\|\|/, "");
              gsub(/\^.*$/, "");
              if ($0 ~ /^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?\.[a-zA-Z]{2,}$/ && $0 !~ /\*/ && $0 !~ /\.\./) print $0
            }
          ' >> ./community/data/ads-extra || true
          echo "" >> ./community/data/ads-extra

          # C. Malikshi Antiscam (Fix Trailing Dots & Invalid Chars)
          wget -qO- $ANTISCAM | sed 's/\r//g' | awk '
            !/^#/ && NF {
              gsub(/[^a-zA-Z0-9.-]/, "");
              gsub(/\.$/, ""); # Hapus titik di paling akhir domain jika ada
              if ($0 ~ /^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?\.[a-zA-Z]{2,}$/ && $0 !~ /\*/ && $0 !~ /\.\./) print $0
            }
          ' >> ./community/data/ads-extra || true
