name: Build V2Ray rules dat files

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: '30 17 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'

      - name: Set timezone to WIB Jakarta
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          date

      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          
          echo "ANTISCAM=https://raw.githubusercontent.com/malikshi/antiscam/refs/heads/main/antiscam.txt" >> $GITHUB_ENV
          echo "RULE_ADS_EXTENDED=https://raw.githubusercontent.com/malikshi/v2ray-rules-dat/rule/rule_ads.txt" >> $GITHUB_ENV
          echo "RULE_ADS_JADAHMAMBU=https://raw.githubusercontent.com/jadahmambu/ocrule/main/adsblock.txt" >> $GITHUB_ENV
          echo "RULE_BANK_ID=https://raw.githubusercontent.com/malikshi/v2ray-rules-dat/rule/rule_bank-id.txt" >> $GITHUB_ENV
          echo "RULE_BANK_JADAHMAMBU=https://raw.githubusercontent.com/jadahmambu/ocrule/main/rule_bank.txt" >> $GITHUB_ENV
          echo "OISD_NSFW=https://nsfw.oisd.nl/dnsmasq" >> $GITHUB_ENV
          
          echo "RULE_ECO=https://raw.githubusercontent.com/jadahmambu/ocrule/main/rule_eco.txt" >> $GITHUB_ENV
          echo "RULE_MICROSOFT=https://raw.githubusercontent.com/jadahmambu/ocrule/main/rule_microsoft.txt" >> $GITHUB_ENV
          echo "RULE_SOSMED=https://raw.githubusercontent.com/jadahmambu/ocrule/main/rule_sosmed.txt" >> $GITHUB_ENV
          echo "RULE_STREAMING=https://raw.githubusercontent.com/jadahmambu/ocrule/main/rule_streaming.txt" >> $GITHUB_ENV
          echo "RULE_VIDCONFERENCE=https://raw.githubusercontent.com/jadahmambu/ocrule/main/rule_videoconference.txt" >> $GITHUB_ENV

      - name: Prepare Data Directory
        run: |
          rm -rf community publish
          mkdir -p community/data publish

      - name: Get geoip.dat relative files
        run: |
          wget -q https://github.com/malikshi/geoip/raw/release/geoip.dat -O ./publish/geoip.dat || true

      - name: Create lists
        run: |
          # 1. ANTISCAM
          wget -qO ./community/data/antiscam $ANTISCAM || echo "full:ex.com" > ./community/data/antiscam
          sed -i '/[^a-zA-Z0-9\.\-]/d' ./community/data/antiscam || true
          
          # 2. RULE-ADS (Penggabungan Malikshi + Sanitasi Total Adsblock Jadahmambu)
          wget -qO ./community/data/rule-ads $RULE_ADS_EXTENDED || echo "full:ex.com" > ./community/data/rule-ads
          wget -qO- $RULE_ADS_JADAHMAMBU | sed 's/\r//g' | while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            clean_line=$(echo "$line" | sed -E 's/^[a-zA-Z0-9_-]+://g')
            if [[ -n "$clean_line" ]]; then
              echo "$clean_line" >> ./community/data/rule-ads
            fi
          done
          
          # 3. BANK-ID (Penggabungan Malikshi + Sanitasi Total Jadahmambu)
          > ./community/data/bank-id
          wget -qO- $RULE_BANK_ID | sed 's/\r//g' >> ./community/data/bank-id || true

          wget -qO ./community/data/bank-id-raw $RULE_BANK_JADAHMAMBU || true
          sed -i 's/\r//g' ./community/data/bank-id-raw || true
          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# || "$line" =~ include:bank-id ]] && continue
            
            clean=$(echo "$line" | sed -E 's/^[[:space:]]*-?[[:space:]]*//')
            
            if [[ "$clean" =~ ^DOMAIN-KEYWORD, ]]; then
              echo "keyword:${clean#DOMAIN-KEYWORD,}" >> ./community/data/bank-id
            elif [[ "$clean" =~ ^DOMAIN-SUFFIX, ]]; then
              echo "${clean#DOMAIN-SUFFIX,}" >> ./community/data/bank-id
            elif [[ "$clean" =~ ^DOMAIN, ]]; then
              echo "full:${clean#DOMAIN,}" >> ./community/data/bank-id
            elif [[ "$clean" =~ ^domain: ]]; then
              echo "${clean#domain:}" >> ./community/data/bank-id
            elif [[ "$clean" =~ ^keyword: ]]; then
              echo "$clean" >> ./community/data/bank-id
            elif [[ -n "$clean" && ! "$clean" =~ ^DST-PORT && ! "$clean" =~ ^IP-CIDR ]]; then
              echo "$clean" >> ./community/data/bank-id
            fi
          done < ./community/data/bank-id-raw

          # 4. OISD NSFW (Situs Dewasa)
          curl -fsSL $OISD_NSFW | perl -ne '/^server=\/([^\/]+)\// && print "$1\n"' > ./community/data/oisd-nsfw || echo "full:ex.com" > ./community/data/oisd-nsfw

          # 5. RULE-ECO
          wget -qO ./community/data/rule-eco-raw $RULE_ECO || echo "full:ex.com" > ./community/data/rule-eco-raw
          sed -i 's/\r//g' ./community/data/rule-eco-raw || true
          > ./community/data/rule-eco
          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [[ "$line" =~ ^keyword: ]]; then
              echo "$line" >> ./community/data/rule-eco
            elif [[ "$line" =~ ^domain: ]]; then
              echo "${line#domain:}" >> ./community/data/rule-eco
            else
              echo "$line" >> ./community/data/rule-eco
            fi
          done < ./community/data/rule-eco-raw

          # 6. RULE-MICROSOFT
          wget -qO ./community/data/rule-microsoft-raw $RULE_MICROSOFT || echo "full:ex.com" > ./community/data/rule-microsoft-raw
          sed -i 's/\r//g' ./community/data/rule-microsoft-raw || true
          > ./community/data/rule-microsoft
          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [[ "$line" =~ ^keyword: ]]; then
              echo "$line" >> ./community/data/rule-microsoft
            elif [[ "$line" =~ ^domain: ]]; then
              echo "${line#domain:}" >> ./community/data/rule-microsoft
            else
              echo "$line" >> ./community/data/rule-microsoft
            fi
          done < ./community/data/rule-microsoft-raw

          # 7. RULE-SOSMED
          wget -qO ./community/data/rule-sosmed-raw $RULE_SOSMED || echo "full:ex.com" > ./community/data/rule-sosmed-raw
          sed -i 's/\r//g' ./community/data/rule-sosmed-raw || true
          > ./community/data/sosmed
          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [[ "$line" =~ ^keyword: ]]; then
              echo "$line" >> ./community/data/sosmed
            elif [[ "$line" =~ ^domain: ]]; then
              echo "${line#domain:}" >> ./community/data/sosmed
            else
              echo "$line" >> ./community/data/sosmed
            fi
          done < ./community/data/rule-sosmed-raw

          # 8. RULE-STREAMING
          wget -qO ./community/data/rule-streaming-raw $RULE_STREAMING || echo "full:ex.com" > ./community/data/rule-streaming-raw
          sed -i 's/\r//g' ./community/data/rule-streaming-raw || true
          > ./community/data/streaming
          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [[ "$line" =~ ^keyword: ]]; then
              echo "$line" >> ./community/data/streaming
            elif [[ "$line" =~ ^domain: ]]; then
              echo "${line#domain:}" >> ./community/data/streaming
            else
              echo "$line" >> ./community/data/streaming
            fi
          done < ./community/data/rule-streaming-raw

          # 9. RULE-VIDCONFERENCE
          wget -qO ./community/data/rule-vidconference-raw $RULE_VIDCONFERENCE || echo "full:ex.com" > ./community/data/rule-vidconference-raw
          sed -i 's/\r//g' ./community/data/rule-vidconference-raw || true
          > ./community/data/vidconference
          while read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [[ "$line" =~ ^keyword: ]]; then
              echo "$line" >> ./community/data/vidconference
            elif [[ "$line" =~ ^domain: ]]; then
              echo "${line#domain:}" >> ./community/data/vidconference
            else
              echo "$line" >> ./community/data/vidconference
            fi
          done < ./community/data/rule-vidconference-raw

          # SYARAT COMPILER: Buat berkas cn dan geolocation-cn dummy
          echo "full:example-direct.com" > ./community/data/cn
          echo "full:example-proxy.com" > ./community/data/geolocation-cn

      - name: Automated Dependency Patcher & Deduplication
        run: |
          grep -hroE 'include:[a-zA-Z0-9\.\-]+' ./community/data/ | awk -F: '{print tolower($2)}' | sort -u | while read -r list_name; do
            if [ ! -f "./community/data/$list_name" ]; then
              echo "Membuat berkas dummy aman untuk dependensi: $list_name"
              echo "full:example-fix-$list_name.com" > "./community/data/$list_name"
            fi
          done
          
          # Hapus baris duplikat di setiap file
          for f in ./community/data/*; do
            if [ -f "$f" ]; then
              sort -u "$f" -o "$f"
            fi
          done

      - name: Build geosite.dat using Go Install
        run: |
          go install github.com/v2fly/domain-list-community@latest
          ~/go/bin/domain-list-community --datapath=./community/data
          mv ./dlc.dat ./publish/geosite.dat

      - name: Deploy to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          name: latest
          tag_name: latest
          draft: false
          prerelease: false
          files: |
            ./publish/geoip.dat
            ./publish/geosite.dat
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
