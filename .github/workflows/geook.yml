- name: Build geoip tool
        working-directory: geoip_tool
        run: |
          set -euo pipefail
          go mod download
          go build -o geoip_bin .

      - name: Generate geoip artifacts
        working-directory: geoip_tool
        run: |
          set -euo pipefail
          rm -rf output
          ./geoip_bin -c config.json
          ls -lh output/dat/*.dat
