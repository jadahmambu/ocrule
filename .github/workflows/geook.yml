- name: Build & Run geoip (Standalone Go)
        working-directory: geoip_tool
        run: |
          set -euo pipefail
          mkdir -p output/dat

          cat << 'EOF' > builder.go
          package main

          import (
          	"bufio"
          	"fmt"
          	"log"
          	"os"
          	"strings"

          	"github.com/v2fly/geoip/output"
          	"github.com/v2fly/geoip/router"
          )

          func buildGeoIP() {
          	files, err := os.ReadDir(".")
          	if err != nil {
          		log.Fatalf("Gagal membaca folder: %v", err)
          	}

          	var geoipList []*router.GeoIP

          	for _, f := range files {
          		if f.IsDir() || !strings.HasSuffix(f.Name(), ".txt") {
          			continue
          		}

          		tagName := strings.ToUpper(strings.TrimSuffix(f.Name(), ".txt"))
          		file, err := os.Open(f.Name())
          		if err != nil {
          			continue
          		}

          		var cidrs []*router.CIDR
          		scanner := bufio.NewScanner(file)
          		for scanner.Scan() {
          			line := strings.TrimSpace(scanner.Text())
          			if line == "" || strings.HasPrefix(line, "#") || strings.HasPrefix(line, "!") {
          				continue
          			}
          			cidr, err := router.ParseCIDR(line)
          			if err == nil {
          				cidrs = append(cidrs, cidr)
          			}
          		}
          		file.Close()

          		if len(cidrs) > 0 {
          			geoipList = append(geoipList, &router.GeoIP{
          				CountryCode: tagName,
          				Cidr:        cidrs,
          			})
          			fmt.Printf("✓ Tag dibuat: %s (%d CIDR)\n", tagName, len(cidrs))
          		}
          	}

          	err = output.WriteV2Ray(geoipList, "output/dat/geoipok.dat")
          	if err != nil {
          		log.Fatalf("Gagal membuat geoipok.dat: %v", err)
          	}
          	fmt.Println("➜ Berhasil dikompilasi ke output/dat/geoipok.dat")
          }
          EOF

          # Jalankan runner kustom bersama seluruh file paket utama
          go run . -c /dev/null 2>/dev/null || go run builder.go
          ls -lh output/dat/*.dat
