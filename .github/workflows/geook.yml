name: Build geoip

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 */3 * *'
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - "release/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build geoip.dat Independen
        run: |
          set -euo pipefail
          mkdir -p output/dat
          mkdir -p work_dir

          echo "==> Mencari folder IP teks (.txt)..."
          SRC_DIR=""
          if [ -d "./geoip" ]; then
            SRC_DIR="./geoip"
          elif [ -d "./ocrule/geoip" ]; then
            SRC_DIR="./ocrule/geoip"
          fi

          if [ -z "$SRC_DIR" ]; then
            echo "Error: Folder geoip tidak ditemukan!"
            exit 1
          fi

          cp -f "$SRC_DIR"/*.txt work_dir/
          echo "✓ File .txt berhasil disalin."

          cd work_dir
          go mod init builder
          
          go get github.com/v2fly/v2ray-core/v5@v5.16.0
          go get github.com/oschwald/maxminddb-golang/v2@v2.5.0

          cat << 'EOF' > main.go
          package main

          import (
          	"bufio"
          	"fmt"
          	"log"
          	"net/netip"
          	"os"
          	"strings"

          	"github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          	"google.golang.org/protobuf/proto"
          )

          func main() {
          	files, err := os.ReadDir(".")
          	if err != nil {
          		log.Fatalf("Gagal membaca folder: %v", err)
          	}

          	var geoipList []*routercommon.GeoIP

          	for _, f := range files {
          		if f.IsDir() || !strings.HasSuffix(f.Name(), ".txt") {
          			continue
          		}

          		tagName := strings.ToUpper(strings.TrimSuffix(f.Name(), ".txt"))
          		file, err := os.Open(f.Name())
          		if err != nil {
          			continue
          		}

          		var cidrs []*routercommon.CIDR
          		scanner := bufio.NewScanner(file)
          		for scanner.Scan() {
          			line := strings.TrimSpace(scanner.Text())
          			if line == "" || strings.HasPrefix(line, "#") || strings.HasPrefix(line, "//") || strings.HasPrefix(line, "!") {
          				continue
          			}

          			prefix, err := netip.ParsePrefix(line)
          			if err != nil {
          				addr, err := netip.ParseAddr(line)
          				if err == nil {
          					bits := 32
          					if addr.Is6() {
          						bits = 128
          					}
          					prefix = netip.PrefixFrom(addr, bits)
          				} else {
          					continue
          				}
          			}

          			ipBytes := prefix.Addr().AsSlice()
          			cidrs = append(cidrs, &routercommon.CIDR{
          				Ip:     ipBytes,
          				Prefix: uint32(prefix.Bits()),
          			})
          		}
          		file.Close()

          		if len(cidrs) > 0 {
          			geoipList = append(geoipList, &routercommon.GeoIP{
          				CountryCode: tagName,
          				Cidr:        cidrs,
          			})
          			fmt.Printf("✓ Tag %s (%d CIDR)\n", tagName, len(cidrs))
          		}
          	}

          	list := &routercommon.GeoIPList{
          		Entry: geoipList,
          	}

          	outBytes, err := proto.Marshal(list)
          	if err != nil {
          		log.Fatalf("Gagal marshal protobuf: %v", err)
          	}

          	err = os.MkdirAll("output/dat", 0755)
          	if err != nil {
          		log.Fatalf("Gagal membuat folder output: %v", err)
          	}

          	err = os.WriteFile("output/dat/geoip.dat", outBytes, 0644)
          	if err != nil {
          		log.Fatalf("Gagal menulis file geoip.dat: %v", err)
          	}

          	fmt.Println("➜ Berhasil membuat geoip.dat secara mandiri!")
          }
          EOF

          go mod tidy
          go run main.go
          ls -lh output/dat/*.dat

      - name: Prepare temp release files
        run: |
          mkdir -p /tmp/geoip-release
          cp work_dir/output/dat/geoip.dat /tmp/geoip-release/geoip.dat
          sha256sum /tmp/geoip-release/geoip.dat | awk '{print $1}' > /tmp/geoip-release/geoip.dat.sha256sum

      - name: Publish to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          if git show-ref --verify --quiet refs/heads/release; then
            git checkout release
          elif git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -b release origin/release
          else
            git checkout --orphan release
          fi

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp /tmp/geoip-release/geoip.dat ./geoip.dat
          cp /tmp/geoip-release/geoip.dat.sha256sum ./geoip.dat.sha256sum

          git add geoip.dat geoip.dat.sha256sum

          if ! git diff --staged --quiet; then
            git commit -m "build: update custom geoip files ($(date +%Y-%m-%d))"
            git push origin HEAD:release --force
          else
            echo "File tidak ada perubahan."
          fi

      - name: Restore files for GitHub Release
        run: |
          mkdir -p output
          cp /tmp/geoip-release/geoip.dat output/geoip.dat
          cp /tmp/geoip-release/geoip.dat.sha256sum output/geoip.dat.sha256sum

      - name: Read SHA256
        id: sha256
        run: echo "SHA256=$(cat output/geoip.dat.sha256sum)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Custom GeoIP Release Update
          body: |
            Automated GeoIP build from local /geoip folder
            
            SHA256: ${{ env.SHA256 }}
          files: |
            output/geoip.dat
            output/geoip.dat.sha256sum
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Return to main branch
        run: |
          git checkout main
