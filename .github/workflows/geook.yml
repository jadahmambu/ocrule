name: Build geoip

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 */3 * *'
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"
      - "release/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Checkout v2fly/geoip Builder Engine
        uses: actions/checkout@v4
        with:
          repository: v2fly/geoip
          path: geoip_tool
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geoip_tool/go.mod
          cache: false

      - name: Build & Compile geoipok.dat
        run: |
          set -euo pipefail
          
          echo "==> 1. Menyiapkan ruang kerja yang terisolasi..."
          mkdir -p builder_workspace/input
          mkdir -p builder_workspace/output/dat
          
          echo "==> 2. Mencari folder sumber teks IP (.txt)..."
          SRC_DIR=""
          if [ -d "./geoip" ]; then
            SRC_DIR="./geoip"
          elif [ -d "./ocrule/geoip" ]; then
            SRC_DIR="./ocrule/geoip"
          fi
          
          if [ -z "$SRC_DIR" ]; then
            echo "❌ Error: Folder geoip tidak ditemukan di repositori!"
            exit 1
          fi
          
          shopt -s nullglob
          files=($SRC_DIR/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ Error: Folder $SRC_DIR ditemukan, tapi kosong (tidak ada file .txt)!"
            exit 1
          fi
          
          cp -f "$SRC_DIR"/*.txt builder_workspace/input/
          echo "✓ Berhasil menyalin ${#files[@]} file .txt ke ruang kompilasi."
          
          echo "==> 3. Mendeteksi modul Go dari v2fly/geoip secara dinamis..."
          UPSTREAM_MOD=$(head -n 1 geoip_tool/go.mod | awk '{print $2}')
          echo "✓ Modul hulu terdeteksi: $UPSTREAM_MOD"
          
          cd builder_workspace
          
          echo "==> 4. Inisialisasi modul lokal mandiri..."
          go mod init mybuilder
          
          # Baris ini memastikan Go mencari paket V2Ray di folder lokal, bukan mendownload dari internet!
          go mod edit -replace $UPSTREAM_MOD=../geoip_tool
          
          echo "==> 5. Membuat skrip Go kustom anti-gagal..."
          cat << 'EOF' > main.go
          package main

          import (
          	"bufio"
          	"fmt"
          	"log"
          	"net/netip"
          	"os"
          	"path/filepath"
          	"strings"

          	"UPSTREAM_MOD/output"
          	"UPSTREAM_MOD/router"
          )

          func main() {
          	files, err := os.ReadDir("input")
          	if err != nil {
          		log.Fatalf("Gagal membaca folder input: %v", err)
          	}

          	var geoipList []*router.GeoIP

          	for _, f := range files {
          		if f.IsDir() || !strings.HasSuffix(f.Name(), ".txt") {
          			continue
          		}

          		tagName := strings.ToUpper(strings.TrimSuffix(f.Name(), ".txt"))
          		file, err := os.Open(filepath.Join("input", f.Name()))
          		if err != nil {
          			continue
          		}

          		var cidrs []*router.CIDR
          		scanner := bufio.NewScanner(file)
          		for scanner.Scan() {
          			line := strings.TrimSpace(scanner.Text())
          			if line == "" || strings.HasPrefix(line, "#") || strings.HasPrefix(line, "//") || strings.HasPrefix(line, "!") {
          				continue
          			}

          			prefix, err := netip.ParsePrefix(line)
          			if err != nil {
          				addr, err := netip.ParseAddr(line)
          				if err == nil {
          					bits := 32
          					if addr.Is6() {
          						bits = 128
          					}
          					prefix = netip.PrefixFrom(addr, bits)
          				} else {
          					continue
          				}
          			}

          			ipBytes := prefix.Addr().AsSlice()
          			cidrs = append(cidrs, &router.CIDR{
          				Ip:     ipBytes,
          				Prefix: uint32(prefix.Bits()),
          			})
          		}
          		file.Close()

          		if len(cidrs) > 0 {
          			geoipList = append(geoipList, &router.GeoIP{
          				CountryCode: tagName,
          				Cidr:        cidrs,
          			})
          			fmt.Printf("  ✓ Tag %s (%d CIDR)\n", tagName, len(cidrs))
          		}
          	}

          	outputPath := filepath.Join("output", "dat", "geoipok.dat")
          	err = output.WriteV2Ray(geoipList, outputPath)
          	if err != nil {
          		log.Fatalf("❌ Gagal menulis geoipok.dat: %v", err)
          	}

          	fmt.Println("➜ Berhasil membuat file output/dat/geoipok.dat!")
          }
          EOF
          
          # Ubah placeholder dengan nama asli modul V2fly hulu
          sed -i "s|UPSTREAM_MOD|$UPSTREAM_MOD|g" main.go
          
          echo "==> 6. Mengunduh dependensi (go mod tidy)..."
          go mod tidy
          
          echo "==> 7. Menjalankan kompilasi..."
          go run main.go
          
          ls -lh output/dat/*.dat

      - name: Prepare temp release files
        run: |
          mkdir -p /tmp/geoip-release
          cp builder_workspace/output/dat/geoipok.dat /tmp/geoip-release/geoipok.dat
          sha256sum /tmp/geoip-release/geoipok.dat | awk '{print $1}' > /tmp/geoip-release/geoipok.dat.sha256sum

      - name: Publish to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin

          if git show-ref --verify --quiet refs/heads/release; then
            git checkout release
          elif git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout -b release origin/release
          else
            git checkout --orphan release
          fi

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx

          cp /tmp/geoip-release/geoipok.dat ./geoipok.dat
          cp /tmp/geoip-release/geoipok.dat.sha256sum ./geoipok.dat.sha256sum

          git add geoipok.dat geoipok.dat.sha256sum

          if ! git diff --staged --quiet; then
            git commit -m "build: update custom geoipok files ($(date +%Y-%m-%d))"
            git push origin HEAD:release --force
          else
            echo "File tidak ada perubahan."
          fi

      - name: Restore files for GitHub Release
        run: |
          mkdir -p output
          cp /tmp/geoip-release/geoipok.dat output/geoipok.dat
          cp /tmp/geoip-release/geoipok.dat.sha256sum output/geoipok.dat.sha256sum

      - name: Read SHA256
        id: sha256
        run: echo "SHA256=$(cat output/geoipok.dat.sha256sum)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Custom GeoIP Release Update
          body: |
            Automated GeoIP build from local /geoip folder
            
            SHA256: ${{ env.SHA256 }}
          files: |
            output/geoipok.dat
            output/geoipok.dat.sha256sum
          fail_on_unmatched_files: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Return to main branch
        run: |
          git checkout main
