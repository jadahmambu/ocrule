name: Debug and Build GeoIP

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  debug-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 1. Cek Struktur Folder Repository
        run: |
          echo "=== LOKASI DIREKTORI SAAT INI ==="
          pwd
          echo "=== DAFTAR BERKAS DI ROOT ==="
          ls -la
          echo "=== CEK KEBERADAAN FOLDER GEOIP ==="
          if [ -d "./geoip" ]; then
            echo "Folder ./geoip DITEMUKAN!"
            ls -la ./geoip
          elif [ -d "./ocrule/geoip" ]; then
            echo "Folder ./ocrule/geoip DITEMUKAN!"
            ls -la ./ocrule/geoip
          else
            echo "ERROR CRITICAL: Folder geoip TIDAK DITEMUKAN sama sekali!"
          fi

      - name: 2. Test Eksekusi Go Engine
        run: |
          mkdir -p publish clean_geoip
          
          # Tentukan folder sumber
          SRC_DIR="./geoip"
          if [ ! -d "$SRC_DIR" ]; then
            SRC_DIR="./ocrule/geoip"
          fi

          # Bersihkan file teks
          echo "Membersihkan file dari: $SRC_DIR"
          for f in $SRC_DIR/*.txt; do
            if [ -f "$f" ]; then
              base=$(basename "$f")
              grep -v '^#' "$f" | grep -v '^!' | sed 's/IP-CIDR,//g' | sed 's/IP-CIDR6,//g' | tr -d ' ' > "./clean_geoip/$base"
            fi
          done

          echo "=== ISI FOLDER CLEAN_GEOIP ==="
          ls -la ./clean_geoip
          
          # Clone & Buat Go Script Debugger
          git clone --depth 1 https://github.com/metacubex/geo.git ./geo_tool
          
          cat << 'EOF' > ./geo_tool/debug_run.go
          package main

          import (
          	"fmt"
          	"os"
          	"path/filepath"

          	"github.com/metacubex/geo/convert"
          )

          func main() {
          	cwd, _ := os.Getwd()
          	inputDir := filepath.Join(cwd, "..", "clean_geoip")
          	outputFile := filepath.Join(cwd, "..", "publish", "geoip.dat")

          	fmt.Println("Source Input Path:", inputDir)
          	fmt.Println("Target Output Path:", outputFile)

          	err := convert.ConvertIP("text", "v2ray", inputDir, outputFile)
          	if err != nil {
          		fmt.Println("CRITICAL ERROR SAAT KONVERSI:", err)
          		os.Exit(1)
          	}
          	fmt.Println("KONVERSI BERHASIL SUKSES!")
          }
EOF

          cd ./geo_tool
          go run debug_run.go
          cd ..

      - name: 3. Cek Hasil Output
        run: |
          echo "=== DAFTAR FILE DI PUBLISH ==="
          ls -lh ./publish/
