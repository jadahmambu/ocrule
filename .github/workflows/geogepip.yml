# -------------------------------------------------------------
      # 2. BUILD GEOIP (Membuat config.json otomatis untuk v2fly/geoip)
      # -------------------------------------------------------------
      - name: Create GeoIP Lists and Config
        run: |
          mkdir -p geoip_src/data
          
          # Buat struktur awal file config.json untuk v2fly/geoip
          echo '{"input": [], "output": {"out": "geoip.dat", "format": "v2ray"}}' > geoip_src/config.json

          if [ -d "./geoip" ]; then
            for filepath in ./geoip/*.txt; do
                [ -e "$filepath" ] || continue
                filename=$(basename "$filepath")
                
                tagname=$(echo "${filename%.txt}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
                target_file="./geoip_src/data/$tagname"
                
                echo "⚙️ Memproses GeoIP file $filename -> Tag: $tagname"
                
                sed 's/\r//g' "$filepath" | awk '
                    !/^#/ && NF {
                        gsub(/^[ \t]*-?[ \t]*/, "");
                        sub(/^IP-CIDR,/, "");
                        sub(/^IP-CIDR6,/, "");
                        print $0;
                    }
                ' > "$target_file"

                # Tambahkan konfigurasi input secara dinamis ke config.json menggunakan jq
                jq --arg name "$tagname" --arg path "data/$tagname" \
                   '.input += [{"name": $name, "type": "text", "path": $path}]' \
                   geoip_src/config.json > geoip_src/config.json.tmp && mv geoip_src/config.json.tmp geoip_src/config.json
            done
          fi
          
          # Jika folder geoip kosong, buat input dummy agar tidak error
          if [ ! "$(ls -A ./geoip/ 2>/dev/null)" ]; then
              echo "1.0.0.0/8" > ./geoip_src/data/private
              jq '.input += [{"name": "private", "type": "text", "path": "data/private"}]' \
                 geoip_src/config.json > geoip_src/config.json.tmp && mv geoip_src/config.json.tmp geoip_src/config.json
          fi

      - name: Build geoip.dat
        run: |
          go install github.com/v2fly/geoip@latest
          cd geoip_src
          $(go env GOPATH)/bin/geoip -c config.json
          cd ..
          if [ -f "./geoip_src/geoip.dat" ]; then
              mv ./geoip_src/geoip.dat ./publish/geoip.dat
          elif [ -f "./geoip_src/dat" ]; then
              mv ./geoip_src/dat ./publish/geoip.dat
          fi
